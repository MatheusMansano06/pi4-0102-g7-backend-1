# Integracao continua (card H01.3).
#
# A cada push e a cada pull request o GitHub compila o projeto e roda os
# testes JUnit. Se algum teste quebrar, aparece um X vermelho no commit e
# a pessoa fica sabendo na hora, sem precisar que alguem avise.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    name: Compilar e testar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          # Guarda as bibliotecas baixadas para a proxima execucao ser mais rapida.
          cache: maven

      - name: Compilar e rodar os testes
        run: mvn -B test
