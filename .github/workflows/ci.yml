# Integracao continua (card H01.3).
#
# A cada push e a cada pull request o GitHub compila o projeto e roda os
# testes JUnit. Se algum teste quebrar, aparece um X vermelho no commit e
# a pessoa fica sabendo na hora, sem precisar que alguem avise.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    name: Compilar e testar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          # Guarda as bibliotecas baixadas para a proxima execucao ser mais rapida.
          cache: maven

      - name: Compilar e rodar os testes
        run: mvn -B test

  docker:
    name: Conferir ambiente Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Conferir os arquivos Compose
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.testes.yml config --quiet

      - name: Compilar a imagem de testes
        run: docker build --target testes -t archflow-testes .

      - name: Rodar os testes no container
        run: docker run --rm archflow-testes
