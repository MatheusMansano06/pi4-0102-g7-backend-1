# Configuracao do nginx do frontend. Vai na RAIZ do repositorio
# pi4-0102-g7-frontend, ao lado do Dockerfile.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Repassa para o backend tudo que comeca com /api. O navegador fala so com
    # o nginx, na porta 80, e por isso nao existe CORS nesta versao.
    # "backend" e o nome do servico no docker-compose.prod.yml.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Qualquer outro endereco devolve o index.html, para quando o front passar
    # a ter rotas (/catalogo, /solicitacoes). Sem isso o F5 numa rota da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
